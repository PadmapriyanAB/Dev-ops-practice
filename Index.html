<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 24px;
            text-align: center;
        }

        main {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        section {
            background: white;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        button {
            background: #2563eb;
            color: white;
            border: 0;
            border-radius: 4px;
            padding: 10px 16px; 
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to My Website</h1>
    </header>

    <main>
        <section>
            <h2>Hello!</h2>
            <p>This is a simple HTML sample page.<br>Use the button below to interact with the page.<br>test</p>
            <button type="button" onclick="alert('Hello!')">Click Me</button>`
        </section>
    </main>
</body>
</html>
